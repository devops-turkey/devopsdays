<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">

  <title>Job Board | DevOpsDays Istanbul 2026</title>
  <meta name="description" content="Open positions from DevOpsDays Istanbul 2026 sponsors.">

  <link rel="icon" type="image/png" href="/images/logos/logo.png">

  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/font-awesome.min.css">
  <link rel="stylesheet" href="/css/xsIcon.css">
  <link rel="stylesheet" href="/css/style.css?v=20261015">
  <link rel="stylesheet" href="/css/responsive.css">

  <style>
    .nav-btn {
      height: 36px !important;
      line-height: 36px !important;
      padding: 0 18px !important;
      font-size: 12px !important;
      margin-top: 0;
      white-space: nowrap;
    }
    .body-inner {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header.header-transparent {
      position: relative;
    }
    .jobs-section {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .jobs-section {
      padding: 80px 0 120px;
      min-height: 70vh;
    }
    @media (max-width: 767px) {
      .jobs-section {
        padding: 50px 0 60px;
      }
      .job-card {
        padding: 24px 20px;
      }
    }
    .jobs-intro {
      color: #fff;
      text-align: center;
      max-width: 640px;
      margin: 0 auto 50px;
    }
    .job-card {
      background: #fff;
      border-radius: 8px;
      padding: 30px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .job-card-logo {
      height: 70px;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .job-card-logo img {
      max-height: 70px;
      max-width: 200px;
      object-fit: contain;
    }
    .job-card h3 {
      color: #0f0d3a;
      font-size: 22px;
      margin-bottom: 15px;
    }
    .job-card ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .job-card li {
      margin-bottom: 10px;
    }
    .job-card li a {
      color: #0f0d3a;
      font-weight: 600;
    }
    .job-card li a:hover {
      color: #ff007a;
    }
    .job-card li a i {
      margin-left: 6px;
      font-size: 12px;
    }
  </style>
</head>

<body class="body-color">
  <div class="body-inner">

    <header id="header" class="header header-transparent">
      <div class="container">
        <nav id="navbarnav" class="navbar navbar-expand-lg navbar-light">
          <a class="navbar-brand" href="/">
            <img src="/images/logos/logo.png" alt="DevOps Days Istanbul">
          </a>
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"><i class="icon icon-menu"></i></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav mx-auto">
              <li class="nav-item nav-link"><a href="/#home">Home</a></li>
              <li class="nav-item nav-link"><a href="/#ts-speakers">Speakers</a></li>
              <li class="nav-item nav-link"><a href="/#schedules">Schedule</a></li>
              <li class="nav-item nav-link"><a href="/#organizer-section">Sponsors</a></li>
              <li class="nav-item nav-link"><a href="/#ts-organizers">Team</a></li>
              <li class="nav-item nav-link"><a href="/#venue">Venue</a></li>
              <li class="nav-item nav-link active"><a href="/jobs/">Jobs</a></li>
            </ul>
            <ul class="navbar-nav">
              <li class="nav-item nav-link">
                <a href="https://kommunity.com/devops-turkiye/events/devopsdays-istanbul-2026-ae573533" target="_blank" class="btn nav-btn">Get Tickets</a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </header>

    <section class="jobs-section section-dark">
      <div class="container">
        <div class="row">
          <div class="col-lg-8 mx-auto">
            <h2 class="section-title white text-center">JOB BOARD</h2>
          </div>
        </div>
        <p class="jobs-intro">Open positions from our sponsors.</p>

        <div class="row">
          <div class="col-lg-4 col-md-6 mb-4">
            <div class="job-card">
              <div class="job-card-logo"><img src="/images/sponsors/cloudflare.png" alt="Cloudflare"></div>
              <h3>Cloudflare</h3>
              <ul>
                <li><a href="https://www.linkedin.com/jobs/search-results/?currentJobId=4465542595&keywords=cloudflare&origin" target="_blank" rel="noopener noreferrer">View Open Position<i class="fa fa-external-link"></i></a></li>
              </ul>
            </div>
          </div>
          <div class="col-lg-4 col-md-6 mb-4">
            <div class="job-card">
              <div class="job-card-logo"><img src="/images/sponsors/kloia.png" alt="Kloia"></div>
              <h3>Kloia</h3>
              <ul>
                <li><a href="https://www.kloia.com/jobs" target="_blank" rel="noopener noreferrer">View Open Position<i class="fa fa-external-link"></i></a></li>
              </ul>
            </div>
          </div>
          <div class="col-lg-4 col-md-6 mb-4">
            <div class="job-card">
              <div class="job-card-logo"><img src="/images/sponsors/cloudbees.png" alt="CloudBees"></div>
              <h3>CloudBees</h3>
              <ul>
                <li><a href="https://recruiting.paylocity.com/Recruiting/Jobs/Details/4496403" target="_blank" rel="noopener noreferrer">View Open Position 1<i class="fa fa-external-link"></i></a></li>
                <li><a href="https://recruiting.paylocity.com/Recruiting/Jobs/Details/4516377" target="_blank" rel="noopener noreferrer">View Open Position 2<i class="fa fa-external-link"></i></a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <div class="speaker-shap">
        <img class="shap1" src="/images/shap/home_speaker_memphis1.png" alt="">
        <img class="shap2" src="/images/shap/home_speaker_memphis2.png" alt="">
      </div>
    </section>

    <div class="footer-area section-dark">
      <footer class="ts-footer ts-footer-item">
        <div class="container">
          <div class="row footer-border">
            <div class="col-lg-6">
              <div class="footer-menu mb-30">
                <ul>
                  <li><a href="/">DevOpsDays İstanbul</a></li>
                </ul>
              </div>
              <div class="ts-footer-social">
                <ul>
                  <li><a href="https://www.facebook.com/devopsdaysistanbul/" target="_blank"><i class="fa fa-facebook"></i></a></li>
                  <li><a href="https://x.com/devopsdaysist" target="_blank"><i class="fa fa-twitter"></i></a></li>
                  <li><a href="https://www.youtube.com/c/DevOpsTurkey" target="_blank"><i class="fa fa-youtube"></i></a></li>
                  <li><a href="https://www.linkedin.com/company/devopsdays/" target="_blank"><i class="fa fa-linkedin"></i></a></li>
                </ul>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="copyright-text text-right">
                <p>2026</p>
              </div>
            </div>
          </div>
        </div>
      </footer>
      <div class="BackTo">
        <a href="#" class="fa fa-angle-up" aria-hidden="true"></a>
      </div>
    </div>

    <script src="/js/jquery.js"></script>
    <script src="/js/popper.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/jquery.appear.min.js"></script>
    <script src="/js/jquery.jCounter.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/owl.carousel.min.js"></script>
    <script src="/js/wow.min.js"></script>
    <script src="/js/isotope.pkgd.min.js"></script>
    <script src="/js/main.js"></script>

  </div>
</body>

</html>
