# DevOpsDays Istanbul 2026 - Sponsors
#
# enabled (global): true/false
#   true  -> tiers are rendered
#   false -> nothing is rendered, "coming soon" message is shown
#
# enabled (per tier): true/false (default: true)
#   set to false to hide a specific tier without removing it
#
# type: tier category (platinum, gold, silver, media)
#
# width (required): logo width in pixels — controls logo size and how many fit per row
#
# Sponsors only need name, url, and image (filename under /images/sponsors/).
#
# Example:
# tiers:
#   - name: "Media"
#     type: media
#     width: 200
#     sponsors:
#       - name: "Kube Events"
#         url: "https://kube.events/"
#         image: "kube_events.png"
#
#   - name: "Platinum"
#     type: platinum
#     width: 300
#     sponsors:
#       - name: "Acme Corp"
#         url: "https://acmecorp.com/"
#         image: "acme.png"

enabled: true

tiers:
  - name: "Platinum"
    type: platinum
    width: 300
    enabled: false
    sponsors: []

  - name: "Gold"
    type: gold
    width: 250
    enabled: true
    sponsors:
      - name: "Kloia"
        url: "https://kloia.com/"
        image: "kloia.png"
      - name: "Enterprise Coding"
        url: "https://enterprisecoding.com/"
        image: "enterprisecoding-elastic.png"

  - name: "Silver"
    type: silver
    width: 200
    enabled: true
    sponsors:
      - name: "KubeAdapt"
        url: "https://kubeadapt.io/"
        image: "kubeadapt.png"

  - name: "Media"
    type: media
    width: 180
    enabled: true
    sponsors:
      - name: "Kube Events"
        url: "https://kube.events/"
        image: "kube_events.png"
