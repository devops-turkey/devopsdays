# DevOpsDays Istanbul 2026 - Sponsors
#
# enabled (global): true/false
#   true  -> tiers are rendered
#   false -> nothing is rendered, "coming soon" message is shown
#
# enabled (per tier): true/false (default: true)
#   set to false to hide a specific tier without removing it
#
# type: tier category (platinum, gold, silver, community, media)
#
# width (required): tier box width in pixels. Each logo is auto-sized inside a
#   width x (width * 0.4) box so all logos look equally big, whatever the file size.
#   Aspect ratio is always preserved.
#
# Sponsors only need name, url, and image (path under /images/sponsors/).
# Optional per-sponsor width disables auto-sizing and forces that exact width.
#
# Example:
# tiers:
#   - name: "Media"
#     type: media
#     width: 200
#     sponsors:
#       - name: "Kube Events"
#         url: "https://kube.events/"
#         image: "kube_events.png"
#
#   - name: "Platinum"
#     type: platinum
#     width: 300
#     sponsors:
#       - name: "Acme Corp"
#         url: "https://acmecorp.com/"
#         image: "acme.png"

enabled: true

tiers:
  - name: "Platinum"
    type: platinum
    width: 400
    enabled: true
    sponsors:
      - name: "Cloudflare"
        url: "https://www.cloudflare.com/"
        image: "cloudflare.png"
      - name: "AWS"
        url: "https://aws.amazon.com/"
        image: "aws.png"
        #width: 140

  - name: "Gold"
    type: gold
    width: 300
    enabled: true
    sponsors:
      - name: "Kloia"
        url: "https://kloia.com/"
        image: "kloia.png"
      - name: "Enterprise Coding"
        url: "https://enterprisecoding.com/"
        image: "enterprisecoding-elastic.png"
      - name: "CloudBees"
        url: "https://www.cloudbees.com/"
        image: "cloudbees.png"

  - name: "Silver"
    type: silver
    width: 250
    enabled: true
    sponsors:
      - name: "KubeAdapt"
        url: "https://kubeadapt.io/"
        image: "kubeadapt.png"

  - name: "Community"
    type: community
    width: 200
    enabled: true
    sponsors:
      - name: "Devnot"
        url: "https://www.devnot.com/"
        image: "community/devnot.png"
      - name: "Istanbul Coders"
        url: "https://www.istanbulcoders.org/"
        image: "community/istanbul-coders.png"
      - name: "Java Day Istanbul"
        url: "https://www.javaday.istanbul/"
        image: "community/javaday.png"
      - name: "JUG Istanbul"
        url: "https://www.jugistanbul.org/"
        image: "community/jugistanbul.png"
      - name: "KCD Istanbul"
        url: "https://kcd.ist/"
        image: "community/kcd-istanbul.png"

  - name: "Media"
    type: media
    width: 200
    enabled: true
    sponsors:
      - name: "Kube Events"
        url: "https://kube.events/"
        image: "kube_events.png"
