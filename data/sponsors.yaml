# DevOpsDays Istanbul 2026 - Sponsors
# enabled: true/false - when false, the sponsors section is hidden and a "coming soon" message is shown
# image: just the filename is enough, /images/sponsors/ prefix is added automatically
# width: logo width in pixels (optional, default: 200)
#
# Usage example:
# tiers:
#   - name: "Platinum Sponsors"
#     col_class: "col-md-4"
#     sponsors:
#       - name: "Acme Corp"
#         url: "https://acmecorp.com/"
#         image: "acme.png"
#         width: 300
#
#   - name: "Gold Sponsors"
#     col_class: "col-md"
#     sponsors:
#       - name: "BigTech"
#         url: "https://bigtech.com/"
#         image: "bigtech.png"
#         width: 150

enabled: false

tiers:
