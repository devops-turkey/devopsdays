    bio: "Sena has experience in understanding and applying security concepts for cloud platforms. She defines security needs for cloud designs, provides security services on AWS, and manages risks for cloud solutions. Sena is recognized as an AWS Security Hero for her expertise and is also one of the organizers for AWS Community Day Turkiye, demonstrating her commitment to building and supporting the cloud community.\n\nShe is skilled in creating secure cloud architectures, implementing best practices, and ensuring compliance with security standards. She has a strong background in incident response, threat analysis, and vulnerability management. Sena is also proficient in automating security processes and integrating security tools to enhance the overall security posture of cloud systems."

