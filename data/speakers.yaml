  # Regular Speakers
  - name: "Alexandre-Xavier Labonté-Lamoureux"
    type: speaker
    title: "AppSec/DevSecOps Consultant"
    company: "Arctiq"
    image: "alexandre_xavier.jpeg"
    bio: "Alexandre-Xavier Labonté-Lamoureux is a passionate IT professional and DevSecOps advocate based in Montreal, with over eight years of experience spanning DevOps, system administration, and cybersecurity. At Arctiq, he helps organizations build secure, efficient software by advancing Application Security (AppSec), Developer Experience (DevEx), and Internal Developer Platforms. A long-time open-source advocate, he dedicated over six years to volunteering in technology and science clubs at his university, fostering a culture of curiosity and collaboration among like-minded students.

    Deeply engaged in the cybersecurity community, Alexandre-Xavier has designed challenges for UnitedCTF, presented at Montréhack, and mentored Canadian student teams at international competitions including the European Cyber Security Challenge (ECSC) and the International Cybersecurity Challenge (ICC). His accolades include the Cybertalent award from École de Cybersécurité, wins at NorthSec and HackQc, and an OCTAS award for leading an innovative domotics project. A lifelong learner currently pursuing a Master's in Software Engineering at ÉTS with a focus on Internal Developer Platforms, Alexandre-Xavier holds knowledge sharing and developer experience at the core of everything he does."

